name: saris_cosmo_center
description: Indian Institute of Cosmetology, Trichology & Nutrition App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.3.0
  smooth_page_indicator: ^1.1.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  get: ^4.7.3
  connectivity_plus: ^7.1.1
  razorpay_flutter: ^1.4.5
  http: ^1.6.0
  share_plus: ^13.1.0
  url_launcher: ^6.3.2
  open_filex: ^4.7.0
  downloadsfolder: ^1.2.0
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.2.1
  image_picker: ^1.2.2
  youtube_player_flutter: 9.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/products/
    - assets/data/
